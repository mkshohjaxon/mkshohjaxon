    <path d="M146 168 H366"/>
    <path d="M256 168 V284 C256 350 294 374 334 374"/>
  </g>
  <circle cx="370" cy="374" r="40" fill="url(#node)" filter="url(#glow)"/>
  <circle cx="358" cy="360" r="11" fill="#fff" fill-opacity=".7"/>
