<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BB0F5"/><stop offset=".5" stop-color="#0B6BE3"/><stop offset="1" stop-color="#0634A0"/>
    </linearGradient>
    <radialGradient id="hl" cx=".22" cy=".12" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#FFF1A8"/><stop offset=".35" stop-color="#FFD232"/><stop offset="1" stop-color="#FF9F00"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#021a5c" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
